services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blog}
      POSTGRES_DB: blog
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U blog"], interval: 5s, retries: 10 }
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://blog:${DB_PASSWORD:-blog}@db:5432/blog
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SEED_DEMO: ${SEED_DEMO:-1}
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]
    restart: unless-stopped
volumes:
  pgdata:
